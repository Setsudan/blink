[package]
name = "blink"
version = "0.1.0"
edition = "2024"
authors = ["Blink"]
description = "Windows tray utility that nudges you to rest your eyes (20/20/20)."
license = "MIT"

[package.metadata.wix]
upgrade-guid = "C4BC7736-B448-4E55-A987-1C7A6E376C89"
path-guid = "F9DC0010-1217-498B-B5FD-4D027A8B35A4"
license = false
eula = false

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"] }
raw-window-handle = "0.6"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "blink"
path = "src/main.rs"
